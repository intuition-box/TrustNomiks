name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders — real values live in Vercel.
      # NEXT_PUBLIC_* vars are public by design (anon key is RLS-protected).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build

  # Plain binary instead of gitleaks/gitleaks-action: the action requires a paid
  # GITLEAKS_LICENSE for organization-owned repos. Known false positives are
  # fingerprinted in .gitleaksignore (picked up automatically from the repo root).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history is required for a history scan
      - name: Install gitleaks
        run: curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --no-banner --redact --verbose .

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders — real values live in Vercel.
      # NEXT_PUBLIC_* vars are public by design (anon key is RLS-protected).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
